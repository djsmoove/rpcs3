name: Build RPCS3 Windows (fork)

on:
  push:
    branches:
      - 'savedata-fix-*'
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  Windows_Build:
    name: RPCS3 Windows
    runs-on: windows-2025
    env:
      COMPILER: msvc
      QT_VER_MAIN: '6'
      QT_VER: '6.8.1'
      QT_VER_MSVC: 'msvc2022'
      QT_DATE: '202411221531'
      QTDIR: C:\Qt\6.8.1\msvc2022_64
      VULKAN_VER: '1.3.268.0'
      VULKAN_SDK_SHA: '8459ef49bd06b697115ddd3d97c9aec729e849cd775f5be70897718a9b3b9db5'
      VULKAN_SDK: C:\VulkanSDK\1.3.268.0
      CACHE_DIR: ./cache
      BUILD_REPOSITORY_NAME: ${{ github.repository }}
      SYSTEM_PULLREQUEST_SOURCEBRANCH: ${{ github.ref_name }}
      BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}/artifacts/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Cache Keys
        run: .ci/get_keys-windows.sh

      - name: Download and unpack dependencies
        run: .ci/setup-windows.sh

      - name: Export Variables
        run: |
          while IFS='=' read -r key val; do
            [[ -z "$key" || "$key" =~ ^# ]] && continue
            echo "$key=$val" >> "$GITHUB_ENV"
          done < .ci/ci-vars.env

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Compile RPCS3
        shell: pwsh
        run: msbuild rpcs3.sln /p:Configuration=Release /v:minimal /p:Platform=x64 /m

      - name: Pack up build artifacts
        run: |
          mkdir -p "$BUILD_ARTIFACTSTAGINGDIRECTORY"
          .ci/deploy-windows.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RPCS3 for Windows (v0.0.34 savedata fix)
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}
          compression-level: 0
          if-no-files-found: error
